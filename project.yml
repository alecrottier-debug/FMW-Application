name: FoxMillWoods

# XcodeGen is the source of truth for the Xcode project. New Swift files dropped
# under App/ (or resources under Resources/) are picked up automatically on the
# next `xcodegen generate` — never hand-edit the .pbxproj. See CLAUDE.md.

options:
  bundleIdPrefix: com.foxmillwoods
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true      # mirror the folder tree as Xcode groups
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"              # Swift 6 language mode (strict concurrency)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  stripe-ios:
    url: https://github.com/stripe/stripe-ios
    from: "24.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"
  braintree-drop-in:
    url: https://github.com/braintree/braintree-ios-drop-in
    from: "9.14.0"

targets:
  FoxMillWoods:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
        excludes:
          - "**/*.md"                # keep the Fonts README out of the bundle
    dependencies:
      - package: stripe-ios
        product: StripePaymentSheet  # Stripe PaymentSheet — dues (US bank/ACH), SAQ A
      - package: GoogleSignIn
        product: GoogleSignIn        # native Google Sign-In
      - package: braintree-drop-in
        product: BraintreeDropIn      # Apple Pay + card + PayPal (events/rentals)
    entitlements:
      path: Config/FoxMillWoods.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default                  # Sign in with Apple
    settings:
      base:
        PRODUCT_NAME: FoxMillWoods
        PRODUCT_BUNDLE_IDENTIFIER: com.foxmillwoods.app
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (see spec §1: iPhone app)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: T8LQMMVLY9  # Alexander Rottier — run on device
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Config/Info.plist         # generated by XcodeGen, kept out of App/ sources
      properties:
        CFBundleDisplayName: Fox Mill Woods
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:                       # matches FMW.display(Fraunces) / FMW.ui(Figtree)
          - Fraunces-Variable.ttf
          - Figtree-Variable.ttf
        # Google Sign-In callback = your reversed iOS client id. After creating the
        # Google OAuth iOS client, replace the placeholder below with
        # com.googleusercontent.apps.<your-id>.
        CFBundleURLTypes:
          - CFBundleURLName: com.foxmillwoods.app.google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.719141246113-3vbeumk61r13ce3hp5sk2rbsbpmb4d61
        # Runtime config read by AppConfig.swift. Empty = demo mode.
        API_BASE_URL: ""
        GOOGLE_CLIENT_ID: "719141246113-3vbeumk61r13ce3hp5sk2rbsbpmb4d61.apps.googleusercontent.com"
        STRIPE_PUBLISHABLE_KEY: ""

  FoxMillWoodsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/FoxMillWoodsTests
    dependencies:
      - target: FoxMillWoods
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foxmillwoods.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FoxMillWoods.app/FoxMillWoods"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  FoxMillWoods:
    build:
      targets:
        FoxMillWoods: all
        FoxMillWoodsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FoxMillWoodsTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
